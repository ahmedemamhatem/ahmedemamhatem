<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Ahmed Emam — Founder of SyncoreHQ. Senior Frappe / ERPNext Developer, Development Team Lead. Riyadh, KSA."><title>Ahmed Emam — Founder of SyncoreHQ. Senior Frappe / ERPNext Developer, Development Team Lead. Riyadh, KSA.</title><style>
