<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 104" width="1200" height="104" role="img" aria-label="Open source"><title>Open source</title><style>
.sans{font-family:Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.pre{white-space:pre}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes bobs{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flow{to{stroke-dashoffset:-48}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes floor{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(var(--d));opacity:1}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(.8);opacity:.28}}
.bob{animation:bob 5s ease-in-out infinite}
.bobs{animation:bobs 4s ease-in-out infinite}
.flow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
.blink{animation:blink 2.4s ease-in-out infinite}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.fadein{animation:fadein .5s ease-out both}
.shadow{transform-box:fill-box;transform-origin:center;animation:shadow 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A212B"/><stop offset="1" stop-color="#0C1118"/></linearGradient><linearGradient id="name" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CFE3F5"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B9DD9"/><stop offset=".55" stop-color="#4F8FD0"/><stop offset="1" stop-color="#3FB6A8"/></linearGradient><linearGradient id="scRing" gradientUnits="userSpaceOnUse" x1="-36" y1="-36" x2="36" y2="36"><stop offset="0" stop-color="#f2a35e"/><stop offset=".5" stop-color="#e8843f"/><stop offset="1" stop-color="#2bb6a8"/></linearGradient><radialGradient id="scCore" cx=".5" cy=".42" r=".62"><stop offset="0" stop-color="#ffd9a8"/><stop offset=".45" stop-color="#f2a35e"/><stop offset="1" stop-color="#d9743a"/></radialGradient><radialGradient id="scGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e8843f" stop-opacity=".4"/><stop offset="1" stop-color="#e8843f" stop-opacity="0"/></radialGradient><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#fff" stop-opacity="1"/></linearGradient><clipPath id="clip"><rect width="1200" height="104" rx="28"/></clipPath></defs><g clip-path="url(#clip)"><rect width="1200" height="104" fill="url(#bg)"/><text x="60" y="64" class="mono" font-size="16" fill="#F2A35E" letter-spacing="2">06</text><text x="104" y="64" class="sans" font-size="34" font-weight="700" fill="#E6EDF3">Open source</text><text x="1140" y="64" class="mono" font-size="14" fill="#9FB0C3" text-anchor="end">tap a card to open the repo</text></g><rect x=".75" y=".75" width="1198.5" height="102.5" rx="27.25" fill="none" stroke="#313D4D" stroke-width="1.5"/></svg>