 y="209" class="mono" font-size="11.5" fill="#9FB0C3">works with any data</text></g><g class="bobs" style="animation-delay:-1.2s"><rect x="850" y="237" width="290" height="46" rx="12" fill="#080B10"/><rect x="850" y="232" width="290" height="46" rx="12" fill="#222B37" stroke="#3D4B5E" stroke-width="1.2"/><circle cx="872" cy="255" r="5" fill="#F2A35E"/><text x="890" y="253" class="sans" font-size="15" font-weight="700" fill="#E6EDF3">Minutes, not months</text><text x="890" y="269" class="mono" font-size="11.5" fill="#9FB0C3">fast to set up</text></g><g class="bobs" style="animation-delay:-1.7999999999999998s"><rect x="850" y="297" width="290" height="46" rx="12" fill="#080B10"/><rect x="850" y="292" width="290" height="46" rx="12" fill="#222B37" stroke="#3D4B5E" stroke-width="1.2"/><circle cx="872" cy="315" r="5" fill="#5B9DD9"/><text x="890" y="313" class="sans" font-size="15" font-weight="700" fill="#E6EDF3">Arabic &amp; English</text><text x="890" y="329" class="mono" font-size="11.5" fill="#9FB0C3">bilingual, RTL-ready</text></g></g><rect x=".75" y=".75" width="1198.5" height="370.5" rx="27.25" fill="none" stroke="#313D4D" stroke-width="1.5"/></svg>