<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 348" width="400" height="348" role="img" aria-label="SyncoreHQ ERP — Accounting, sales, stock and people on one core, with live dashboards and AI insights."><title>SyncoreHQ ERP — Accounting, sales, stock and people on one core, with live dashboards and AI insights.</title><style>
.sans{font-family:Inter,'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.mono{font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.pre{white-space:pre}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes bobs{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes flow{to{stroke-dashoffset:-48}}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes floor{from{transform:translateY(0);opacity:0}15%{opacity:1}to{transform:translateY(var(--d));opacity:1}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(.8);opacity:.28}}
.bob{animation:bob 5s ease-in-out infinite}
.bobs{animation:bobs 4s ease-in-out infinite}
.flow{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
.blink{animation:blink 2.4s ease-in-out infinite}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.fadein{animation:fadein .5s ease-out both}
.shadow{transform-box:fill-box;transform-origin:center;animation:shadow 5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A212B"/><stop offset="1" stop-color="#0C1118"/></linearGradient><linearGradient id="name" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CFE3F5"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5B9DD9"/><stop offset=".55" stop-color="#4F8FD0"/><stop offset="1" stop-color="#3FB6A8"/></linearGradient><linearGradient id="scRing" gradientUnits="userSpaceOnUse" x1="-36" y1="-36" x2="36" y2="36"><stop offset="0" stop-color="#f2a35e"/><stop offset=".5" stop-color="#e8843f"/><stop offset="1" stop-color="#2bb6a8"/></linearGradient><radialGradient id="scCore" cx=".5" cy=".42" r=".62"><stop offset="0" stop-color="#ffd9a8"/><stop offset=".45" stop-color="#f2a35e"/><stop offset="1" stop-color="#d9743a"/></radialGradient><radialGradient id="scGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e8843f" stop-opacity=".4"/><stop offset="1" stop-color="#e8843f" stop-opacity="0"/></radialGradient><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".55" stop-color="#fff" stop-opacity="1"/></linearGradient><clipPath id="clip"><rect width="400" height="348" rx="28"/></clipPath></defs><g clip-path="url(#clip)"><rect width="400" height="348" fill="url(#bg)"/><g class="bob"><polygon points="32.8,86.0 64.0,104.0 64.0,68.0 32.8,50.0" fill="#3FB6A8"/><polygon points="64.0,104.0 95.2,86.0 95.2,50.0 64.0,68.0" fill="#2A8279"/><polygon points="64.0,68.0 95.2,50.0 64.0,32.0 32.8,50.0" fill="#7FD6CB" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1" stroke-linejoin="round"/></g><text x="32" y="156" class="sans" font-size="29" font-weight="800" fill="#E6EDF3" letter-spacing="-.5">Syncore<tspan fill="url(#brand)">HQ</tspan> <tspan fill="#3FB6A8">ERP</tspan></text><text x="32" y="184" class="mono" font-size="13" fill="#3FB6A8" letter-spacing="1.5">BUSINESS MANAGEMENT</text><text x="32" y="224" class="sans" font-size="19" fill="#E6EDF3">Accounting, sales, stock and</text><text x="32" y="251" class="sans" font-size="19" fill="#E6EDF3">people on one core, with live</text><text x="32" y="278" class="sans" font-size="19" fill="#E6EDF3">dashboards and AI insights.</text><text x="32" y="322" class="mono" font-size="13.5" fill="#9FB0C3">multi-company · multi-currency</text></g><rect x=".75" y=".75" width="398.5" height="346.5" rx="27.25" fill="none" stroke="#313D4D" stroke-width="1.5"/></svg>